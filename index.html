<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Website</title>

    <style>
        /* ---------- 基础重置 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #1f2933;
            background-color: #ffffff;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ---------- 通用布局 ---------- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ---------- 顶部导航 ---------- */
        header {
            border-bottom: 1px solid #e5e7eb;
            background: #ffffff;
        }

        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
        }

        .logo {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .nav-links a {
            margin-left: 24px;
            font-size: 14px;
            color: #4b5563;
        }

        .nav-links a:hover {
            color: #2563eb;
        }

        /* ---------- Hero 区域 ---------- */
        .hero {
            padding: 96px 0;
            background: linear-gradient(
                180deg,
                #f9fafb 0%,
                #ffffff 100%
            );
        }

        .hero-content {
            max-width: 700px;
        }

        .hero h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        .hero p {
            font-size: 18px;
            color: #4b5563;
            margin-bottom: 32px;
        }

        .hero-buttons a {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            margin-right: 16px;
        }

        .btn-primary {
            background: #2563eb;
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            border: 1px solid #d1d5db;
            color: #374151;
        }

        .btn-secondary:hover {
            background: #f3f4f6;
        }

        /* ---------- 特性区 ---------- */
        .features {
            padding: 80px 0;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 32px;
        }

        .feature-card {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 32px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .feature-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }

        .feature-card h3 {
            font-size: 18px;
            margin-bottom: 12px;
        }

        .feature-card p {
            font-size: 14px;
            color: #6b7280;
        }

        /* ---------- 页脚 ---------- */
        footer {
            border-top: 1px solid #e5e7eb;
            padding: 32px 0;
            font-size: 14px;
            color: #6b7280;
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        /* ---------- 响应式 ---------- */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 36px;
            }

            .nav-links {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- 顶部导航 -->
    <header>
        <div class="container nav">
            <div class="logo">YourBrand</div>
            <nav class="nav-links">
                <a href="#">首页</a>
                <a href="#">产品</a>
                <a href="#">解决方案</a>
                <a href="#">关于我们</a>
                <a href="#">联系</a>
            </nav>
        </div>
    </header>

    <!-- Hero 区 -->
    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <h1>构建专业、现代且可靠的网站体验</h1>
                <p>
                    我们专注于简洁设计与高质量实现，帮助品牌在数字世界中
                    建立清晰、有力的第一印象。
                </p>
                <div class="hero-buttons">
                    <a href="#" class="btn-primary">立即开始</a>
                    <a href="#" class="btn-secondary">了解更多</a>
                </div>
            </div>
        </div>
    </section>
